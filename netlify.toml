[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/profile/ingest"
  to = "/.netlify/functions/profile-ingestion"
  status = 200

[[redirects]]
  from = "/api/profile/review"
  to = "/.netlify/functions/profile-review"
  status = 200

[[redirects]]
  from = "/api/qualification-gaps"
  to = "/.netlify/functions/qualification-gaps"
  status = 200

[[redirects]]
  from = "/api/application-draft"
  to = "/.netlify/functions/application-draft"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
